<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--or:#D4A575;--rose:#EFC99F;--clair:#FBE6C7;--bronze:#865E3C;--etoile:#FFF0CF;--ligne:#2a1f15;--carte:#0c0905;
--gold:linear-gradient(to right,#865E3C,#D4A575,#FFF0CF,#EFC99F,#865E3C)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--clair);font:400 16px/1.45 Inter,system-ui,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 calc(76px + env(safe-area-inset-bottom,0))}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--or);margin:0}
h2{font-size:26px;margin-bottom:12px}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ligne);position:sticky;top:env(safe-area-inset-top,0);background:#000;z-index:5}
header img{width:46px;height:46px;border-radius:10px}
header .t{flex:1;font-family:'Cormorant Garamond',Georgia,serif;font-size:21px;color:var(--or);font-weight:600}
.cr{text-align:right;font-size:12px;color:var(--rose)}
.cr b{display:block;font-size:19px;color:var(--etoile);font-weight:600}
main{max-width:640px;margin:0 auto;padding:18px 16px}
section{display:none}section.on{display:block}
.card{background:var(--carte);border:1px solid var(--ligne);border-radius:16px;padding:14px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--rose);margin:12px 0 6px}
input[type=text],input[type=password],select,textarea{width:100%;background:#000;color:var(--clair);border:1px solid var(--bronze);border-radius:12px;padding:12px;font:inherit}
textarea{min-height:70px;resize:vertical}
button{font:inherit;cursor:pointer}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--gold);color:#1a1008;font-weight:600;font-size:17px;margin-top:14px}
.btn:disabled{opacity:.5}
.ghost{background:#000;color:var(--or);border:1px solid var(--bronze);border-radius:12px;padding:10px 14px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.chars{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px}
.ch{flex:0 0 78px;text-align:center;font-size:12px;color:var(--rose);background:none;border:0;padding:0}
.ch img,.ph{width:78px;height:78px;object-fit:cover;border-radius:14px;border:2px solid var(--ligne);display:block;margin-bottom:4px;background:#000}
.ch.sel img{border-color:var(--etoile);box-shadow:0 0 12px #D4A57588}
.prev{width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin-top:10px;background:#000;display:none}
.note{font-size:13px;color:var(--or)}
.est{margin-top:10px;font-size:14px;color:var(--etoile)}
.h{display:flex;gap:12px;align-items:center}
.h video{width:84px;height:112px;object-fit:cover;border-radius:10px;background:#000}
.h .i{flex:1;min-width:0;font-size:14px}
.st{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;border:1px solid var(--bronze)}
.st.done{color:var(--etoile);border-color:var(--or)}.st.fail{color:#f0a0a0;border-color:#a05050}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#000;border-top:1px solid var(--ligne);padding-bottom:env(safe-area-inset-bottom,0);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--bronze);padding:12px 4px 10px;font-size:12px}
nav button.on{color:var(--etoile)}nav svg{display:block;margin:0 auto 3px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7}
#toast{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0));background:var(--clair);color:#1a1008;padding:12px 14px;border-radius:12px;font-size:14px;display:none;z-index:9}
:focus-visible{outline:2px solid var(--etoile);outline-offset:2px}
</style></head><body>

<main>
<section id="s-avatar" class="on">
 <h2>Mode Avatar</h2>
 <div class="card">
  <label style="margin-top:0">Personnage</label>
  <div class="chars" id="pick"></div>
  <input type="file" id="fImg" accept="image/*" hidden>
  <button class="ghost" id="bImg" style="width:100%">Choisir une autre photo</button>
  <img class="prev" id="pImg" alt="">
 </div>
 <div class="card">
  <label style="margin-top:0">Vidéo de mouvement (3 à 10 secondes)</label>
  <input type="file" id="fVid" accept="video/*" hidden>
  <input type="file" id="fCam" accept="video/*" capture hidden>
  <div class="row"><button class="ghost" id="bVid">Uploader</button><button class="ghost" id="bCam">Filmer</button></div>
  <video class="prev" id="pVid" controls playsinline muted></video>
  <div class="est" id="est"></div>
 </div>
 <div class="card">
  <label style="margin-top:0">Orientation du personnage</label>
  <select id="ori"><option value="video">Suivre le mouvement de la vidéo</option><option value="image">Rester face caméra comme sur la photo</option></select>
  <label>Description (facultatif)</label>
  <textarea id="prompt" placeholder="Ex : elle présente un produit dans une cuisine lumineuse"></textarea>
 </div>
 <button class="btn" id="go">Générer</button>
 <p class="note" id="status" style="text-align:center"></p>
</section>

<section id="s-chars">
 <h2>Personnages</h2>
 <div class="card">
  <label style="margin-top:0">Nom</label><input type="text" id="cName" placeholder="Ex : Moi, maquillée">
  <input type="file" id="cFile" accept="image/*" hidden>
  <div class="row" style="margin-top:12px"><button class="ghost" id="cPick">Choisir la photo</button><button class="ghost" id="cSave">Enregistrer</button></div>
  <p class="note" id="cInfo"></p>
 </div>
 <div id="cList"></div>
</section>

<section id="s-hist"><h2>Historique</h2><div id="hList"></div></section>

<section id="s-set">
 <h2>Réglages</h2>
 <div class="card">
  <label style="margin-top:0">Clé API Kie.ai</label><input type="password" id="sKey" autocomplete="off" placeholder="Colle ta clé ici">
  <label>Modèle</label><input type="text" id="sModel">
  <label>Qualité</label><select id="sRes"><option>720p</option><option>1080p</option></select>
  <button class="btn" id="sSave">Enregistrer les réglages</button>
  <p class="note">La clé reste sur cet appareil. Tu la saisis une fois sur chaque appareil.</p>
 </div>
</section>
</main>
<div id="toast"></div>
<nav>
 <button data-t="avatar" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Avatar</button>
 <button data-t="chars"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M4 18l5-4 4 3 3-2 4 3"/></svg>Personnages</button>
 <button data-t="hist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historique</button>
 <button data-t="set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Réglages</button>
</nav>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],sleep=ms=>new Promise(r=>setTimeout(r,ms));
const API='https://api.kie.ai/api/v1',UP='https://kieai.redpandaai.co/api/file-stream-upload',PER_SEC=27;
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem('bl_'+k))??d}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem('bl_'+k,JSON.stringify(v))}catch{toast('Stockage plein : supprime des éléments.')}};
let S=load('set',{key:'',model:'kling-3.0/motion-control',res:'720p'}),chars=load('chars',[]),hist=load('hist',[]);
let selChar=null,imgBlob=null,vidBlob=null,dur=0,newChar=null;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3800)}
const auth=()=>{if(!S.key)throw new Error('Ajoute ta clé API dans Réglages.');return{Authorization:'Bearer '+S.key}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* navigation */
$$('nav button').forEach(b=>b.onclick=()=>{$$('nav button').forEach(x=>x.classList.toggle('on',x===b));$$('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+b.dataset.t));scrollTo(0,0)});

/* réglages */
$('#sKey').value=S.key;$('#sModel').value=S.model;$('#sRes').value=S.res;
$('#sSave').onclick=()=>{S={key:$('#sKey').value.trim(),model:$('#sModel').value.trim()||'kling-3.0/motion-control',res:$('#sRes').value};save('set',S);toast('Réglages enregistrés.');credits()};

/* crédits */
async function credits(){const el=$('#credits');if(!S.key){el.textContent='-';return}
 try{const j=await(await fetch(API+'/chat/credit',{headers:auth()})).json();el.textContent=j.code===200?Math.round(j.data).toLocaleString('fr-FR'):'?'}catch{el.textContent='?'}}

/* images */
function shrink(file,max=1024){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',.88)};im.onerror=rej;im.src=URL.createObjectURL(file)})}
const toData=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
const toBlob=async d=>(await fetch(d)).blob();

/* personnages */
function renderChars(){
 $('#pick').innerHTML=chars.length?chars.map(c=>`<button class="ch ${selChar===c.id?'sel':''}" data-id="${c.id}"><img src="${c.img}" alt=""><span>${esc(c.name)}</span></button>`).join(''):'<p class="note">Aucun personnage enregistré. Ajoutes-en un dans l\'onglet Personnages.</p>';
 $$('#pick .ch').forEach(b=>b.onclick=async()=>{selChar=b.dataset.id;const c=chars.find(x=>x.id===selChar);imgBlob=await toBlob(c.img);showImg(c.img);renderChars()});
 $('#cList').innerHTML=chars.map(c=>`<div class="card h"><img class="ph" src="${c.img}" alt=""><div class="i"><b>${esc(c.name)}</b></div><button class="ghost" data-del="${c.id}">Supprimer</button></div>`).join('')||'<p class="note">Ta bibliothèque est vide. Ajoute une photo de référence ci-dessus.</p>';
 $$('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Supprimer ce personnage ?')){chars=chars.filter(c=>c.id!==b.dataset.del);if(selChar===b.dataset.del){selChar=null;imgBlob=null;$('#pImg').style.display='none'}save('chars',chars);renderChars()}})}
function showImg(u){const p=$('#pImg');p.src=u;p.style.display='block'}
$('#cPick').onclick=()=>$('#cFile').click();
$('#cFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;newChar=await toData(await shrink(f));$('#cInfo').textContent='Photo prête : '+f.name};
$('#cSave').onclick=()=>{const n=$('#cName').value.trim();if(!n||!newChar){toast('Il faut un nom et une photo.');return}
 chars.unshift({id:'c'+Date.now(),name:n,img:newChar});save('chars',chars);newChar=null;$('#cName').value='';$('#cInfo').textContent='';$('#cFile').value='';renderChars();toast('Personnage enregistré.')};

/* avatar : sélection des fichiers */
$('#bImg').onclick=()=>$('#fImg').click();
$('#fImg').onchange=async e=>{const f=e.target.files[0];if(!f)return;selChar=null;imgBlob=await shrink(f);showImg(URL.createObjectURL(imgBlob));renderChars()};
$('#bVid').onclick=()=>$('#fVid').click();$('#bCam').onclick=()=>$('#fCam').click();
function setVid(e){const f=e.target.files[0];if(!f)return;vidBlob=f;const p=$('#pVid');p.src=URL.createObjectURL(f);p.style.display='block';
 p.onloadedmetadata=()=>{dur=p.duration;const ok=dur>=3&&dur<=10;$('#est').innerHTML=`Durée : ${dur.toFixed(1)} s. Coût estimé : environ ${Math.round(dur*PER_SEC)} crédits.`+(ok?'':'<br>La vidéo doit durer entre 3 et 10 secondes.')}}
$('#fVid').onchange=setVid;$('#fCam').onchange=setVid;

/* API Kie.ai */
async function upload(blob,name){const f=new FormData();f.append('file',blob,name);f.append('uploadPath','bl-studios');f.append('fileName',name);
 const j=await(await fetch(UP,{method:'POST',headers:auth(),body:f})).json();const u=j.data&&(j.data.downloadUrl||j.data.fileUrl);if(!u)throw new Error(j.msg||'Envoi du fichier impossible.');return u}
async function createTask(p){const r=await fetch(API+'/jobs/createTask',{method:'POST',headers:{...auth(),'Content-Type':'application/json'},
 body:JSON.stringify({model:S.model,input:{prompt:p.prompt||'',input_urls:[p.img],video_urls:[p.vid],mode:S.res,character_orientation:p.ori}})});
 const j=await r.json();if(j.code!==200||!j.data)throw new Error(j.msg||'Kie.ai a refusé la demande.');return j.data.taskId}
async function poll(h){while(h.state==='run'){await sleep(6000);
 try{const d=(await(await fetch(API+'/jobs/recordInfo?taskId='+h.taskId,{headers:auth()})).json()).data||{};
  if(d.state==='success'){let u;try{u=JSON.parse(d.resultJson).resultUrls[0]}catch{}h.state=u?'done':'fail';h.url=u;h.err=u?'':'Résultat introuvable.';if(u)toast('Vidéo prête. Touche Enregistrer dans l\'historique.')}
  else if(d.state==='fail'){h.state='fail';h.err=d.failMsg||'La génération a échoué.'}}catch{}
 save('hist',hist);renderHist()}credits()}
async function start(p){const taskId=await createTask(p);const h={id:'h'+Date.now(),taskId,state:'run',date:Date.now(),p};hist.unshift(h);save('hist',hist);renderHist();poll(h)}

/* génération */
$('#go').onclick=async()=>{const b=$('#go'),st=$('#status');
 try{if(!imgBlob)throw new Error('Choisis une photo de personnage.');if(!vidBlob)throw new Error('Ajoute une vidéo de mouvement.');
  if(dur&&(dur<3||dur>10))throw new Error('La vidéo doit durer entre 3 et 10 secondes.');
  b.disabled=true;st.textContent='Envoi de la photo…';const img=await upload(imgBlob,'avatar-'+Date.now()+'.jpg');
  st.textContent='Envoi de la vidéo…';const vid=await upload(vidBlob,'mouvement-'+Date.now()+'.mp4');
  st.textContent='Lancement…';await start({img,vid,ori:$('#ori').value,prompt:$('#prompt').value.trim()});
  st.textContent='Génération lancée. Suis-la dans l\'onglet Historique.';credits()
 }catch(e){st.textContent='';toast(e.message)}b.disabled=false};

/* historique */
const lab={run:'En cours',done:'Terminée',fail:'Échouée'};
function renderHist(){$('#hList').innerHTML=hist.map(h=>`<div class="card h">${h.url?`<video src="${h.url}#t=0.1" muted playsinline preload="metadata"></video>`:'<div class="ph" style="width:84px;height:112px"></div>'}
 <div class="i"><span class="st ${h.state}">${lab[h.state]}</span><div class="note">${new Date(h.date).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>${h.err?`<div class="note">${esc(h.err)}</div>`:''}
 <div class="row" style="margin-top:8px">${h.url?`<button class="ghost" data-sv="${h.id}">Enregistrer</button>`:''}${h.state==='fail'?`<button class="ghost" data-re="${h.id}">Relancer</button>`:''}<button class="ghost" data-rm="${h.id}">Retirer</button></div></div></div>`).join('')||'<p class="note">Aucune génération pour le moment.</p>';
 $$('[data-sv]').forEach(b=>b.onclick=()=>saveVideo(hist.find(h=>h.id===b.dataset.sv).url));
 $$('[data-re]').forEach(b=>b.onclick=async()=>{try{await start(hist.find(h=>h.id===b.dataset.re).p);toast('Relancée.')}catch(e){toast(e.message)}});
 $$('[data-rm]').forEach(b=>b.onclick=()=>{hist=hist.filter(h=>h.id!==b.dataset.rm);save('hist',hist);renderHist()})}
async function saveVideo(url){const name='bl-studios-'+Date.now()+'.mp4';
 try{const blob=await(await fetch(url)).blob(),file=new File([blob],name,{type:'video/mp4'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()
 }catch(e){if(e.name!=='AbortError')window.open(url,'_blank')}}

renderChars();renderHist();credits();hist.filter(h=>h.state==='run').forEach(poll);
</script></body></html>
