<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analyseur TikTok</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@1,400;1,500&display=swap">
<style>
:root{--bg:#0b0b0d;--card:#111116;--line:#26262e;--tx:#f2f2f2;--mu:#8a8a94;--soft:#17171d;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:400 16px/1.5 'DM Sans',system-ui,sans-serif;padding:env(safe-area-inset-top,0) 18px calc(env(safe-area-inset-bottom,0) + 40px)}
main{max-width:640px;margin:0 auto;padding-top:22px}
h1{font:italic 500 34px/1.1 'Playfair Display',Georgia,serif;margin-bottom:6px}
.sub{color:var(--mu);font-size:14px;margin-bottom:22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 5px}
label:first-child{margin-top:0}
input[type=text],input[type=password]{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:12px;color:var(--tx);font:inherit;font-size:16px;padding:11px 12px}
input:focus{outline:2px solid #fff;outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
details summary{cursor:pointer;color:var(--mu);font-size:14px;padding:2px 0}
.file{display:block;border:1px dashed #3a3a45;border-radius:14px;padding:22px 12px;text-align:center;color:var(--mu);margin:0}
.file b{display:block;color:var(--tx);font-weight:500;margin-bottom:2px}
.file input{display:none}
button{font:inherit;cursor:pointer}
.go{width:100%;margin-top:14px;background:#fff;color:#000;border:0;border-radius:999px;padding:14px;font-weight:700}
.go:disabled{opacity:.5}
#msg{margin-top:12px;font-size:14px;color:var(--mu);white-space:pre-wrap}
#msg.err{color:#ff9d9d}
h2{font:500 14px 'DM Sans',sans-serif;color:var(--mu);margin:26px 0 10px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;font-size:14px}
.chip b{display:block;margin-bottom:2px}
.chip span{color:var(--mu)}
.scene{margin-top:34px}
.head{display:flex;align-items:baseline;gap:14px;margin-bottom:12px}
.num{font:italic 400 44px/1 'Playfair Display',Georgia,serif;color:#555560}
.head h3{font-weight:500;font-size:20px;flex:1}
.ref{font-size:12px;color:var(--mu);text-align:right}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.bt{display:flex;justify-content:space-between;align-items:center;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mu)}
.cp{background:#fff;color:#000;border:0;border-radius:999px;padding:9px 18px;font-weight:500;font-size:15px}
.cp.ghost{background:transparent;color:var(--tx);border:1px solid var(--line);font-size:13px;padding:7px 14px}
pre{font:400 14px/1.6 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word;padding:14px 16px}
.dlg{border-left:3px solid #fff;background:#0f0f13;border-radius:0 18px 18px 0;padding:14px 16px;margin-bottom:12px}
.dlg p{font:italic 400 21px/1.55 'Playfair Display',Georgia,serif}
.dlg .cp{margin-top:12px}
.ph{display:block;width:100%;border-radius:14px;margin-top:10px}
.phw{margin:0 0 12px}
.chip .phw{margin:10px 0 0}
.acts{display:flex;gap:8px;margin-top:8px}
.hidden{display:none}
</style>
</head>
<body>
<main>
<h1>Analyseur TikTok</h1>
<p class="sub">Dépose une vidéo, récupère les scènes prêtes à copier dans Google Flow.</p>

<div class="panel">
<label for="file" class="file" id="drop"><b>Choisir une vidéo</b><span id="fname">MP4 ou MOV, 18 Mo maximum</span><input type="file" id="file" accept="video/*"></label>
<label for="style">Style visuel</label>
<input type="text" id="style">
<button class="go" id="go">Analyser la vidéo</button>
<div id="msg"></div>
<details style="margin-top:14px"><summary>Réglages Gemini</summary>
<label for="key">Clé API Gemini</label>
<input type="password" id="key" autocomplete="off" placeholder="Colle ta clé ici">
<label for="model">Modèle</label>
<input type="text" id="model" autocomplete="off">
</details>
</div>

<div id="out" class="hidden">
<h2>Éléments à changer</h2>
<div class="panel" id="els"></div>
<h2>Personnages</h2>
<div id="chars"></div>
<div id="scenes"></div>
</div>
</main>

<input type="file" id="phin" accept="image/*" class="hidden">
<script>
var $=function(s){return document.querySelector(s)};
function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var data=null,vals={},imgs={},phKey=null;

$('#key').value=ls('gk')||'';
$('#model').value=ls('gm')||'gemini-2.5-flash';
$('#style').value=ls('gs')||'Cinematic Disney Pixar 3D animation';
try{var old=JSON.parse(ls('gd')||'null');if(old&&old.data){data=old.data;vals=old.vals||{};show()}}catch(e){}
function idb(){return new Promise(function(res,rej){var r=indexedDB.open('atk',1);r.onupgradeneeded=function(){r.result.createObjectStore('k')};r.onsuccess=function(){res(r.result)};r.onerror=rej})}
async function idbGet(){try{var d=await idb();return await new Promise(function(res){var q=d.transaction('k').objectStore('k').get('imgs');q.onsuccess=function(){res(q.result||{})};q.onerror=function(){res({})}})}catch(e){return {}}}
async function idbSet(v){try{var d=await idb();d.transaction('k','readwrite').objectStore('k').put(v,'imgs')}catch(e){}}
idbGet().then(function(v){imgs=v;if(data)show()});

function msg(t,err){var m=$('#msg');m.textContent=t||'';m.className=err?'err':''}
function persist(){ss('gd',JSON.stringify({data:data,vals:vals}))}
function sub(t){return String(t||'').replace(/\{\{(\w+)\}\}/g,function(m,id){return vals[id]!=null&&vals[id]!==''?vals[id]:m})}

async function gem(parts){
  var k=$('#key').value.trim();
  if(!k)throw new Error('Colle ta clé API Gemini dans les réglages.');
  var m=$('#model').value.trim()||'gemini-2.5-flash';
  var r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-goog-api-key':k},
    body:JSON.stringify({contents:[{parts:parts}],generationConfig:{responseMimeType:'application/json'}})
  });
  var j=await r.json();
  if(!r.ok)throw new Error((j.error&&j.error.message)||('Erreur '+r.status));
  var c=j.candidates&&j.candidates[0]&&j.candidates[0].content;
  var t=c&&c.parts?c.parts.map(function(p){return p.text||''}).join(''):'';
  if(!t)throw new Error('Gemini n’a rien renvoyé. Réessaie.');
  return JSON.parse(t.replace(/```json|```/g,'').trim());
}

function brief(style){
  return 'Tu analyses cette vidéo TikTok (image et son). Réponds uniquement avec un JSON de cette forme : '+
  '{"titre":"","personnages":[{"nom":"","description":""}],'+
  '"elements":[{"id":"e1","label":"","valeur":""}],'+
  '"scenes":[{"titre":"","ref":"nom du personnage principal","prompt_image":"","dialogue":"","parole":"","prompt_clip":""}]}. '+
  'Règles : '+
  '1) Découpe la vidéo en scènes courtes dans l’ordre. '+
  '2) Décris chaque personnage avec précision (peau, cheveux, vêtements, bijoux, âge) et recopie cette description à l’identique dans chaque prompt_image où il apparaît, pour garder la cohérence. '+
  '3) prompt_image : en anglais, commence par "'+style+'", puis décor, personnage, action, lumière, "vertical 3:4, vibrant cinematic lighting, 4K, no text". '+
  '4) prompt_clip : en anglais, commence par "'+style+'", décor, mouvement, "4-6 seconds, vertical 9:16, subtle lip sync." SANS le dialogue. '+
  '5) dialogue : en français, la scène racontée avec la réplique entre « » (même forme que : Sofia se lève lentement, la voix ferme : « ... » Elle sort sans se retourner.). '+
  '6) parole : uniquement la réplique prononcée, en français. '+
  '7) IMPORTANT : reformule les dialogues avec des mots différents de la vidéo, même idée, même ton, aucun copier-coller. '+
  '8) Tout objet interchangeable (fruit, aliment, objet central, animal) est remplacé par {{e1}}, {{e2}}... dans tous les textes (titres, prompts, dialogues), et listé dans elements avec sa valeur d’origine en français (valeur) et un label clair. Si la valeur doit apparaître en anglais dans un prompt, mets-la en anglais dans valeur.';
}

async function analyse(){
  var f=$('#file').files[0];
  if(!f)return msg('Choisis d’abord une vidéo.',1);
  if(f.size>18e6)return msg('Vidéo trop lourde (18 Mo maximum). Prends une version plus courte ou compressée.',1);
  ss('gk',$('#key').value.trim());ss('gm',$('#model').value.trim());ss('gs',$('#style').value.trim());
  $('#go').disabled=true;msg('Analyse en cours, compte une minute environ…');
  try{
    var b64=await new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result.split(',')[1])};r.onerror=rej;r.readAsDataURL(f)});
    var d=await gem([{inline_data:{mime_type:f.type||'video/mp4',data:b64}},{text:brief($('#style').value.trim()||'Cinematic 3D animation')}]);
    data=d;vals={};imgs={};idbSet(imgs);(d.elements||[]).forEach(function(e){vals[e.id]=e.valeur});
    persist();msg('');show();
    $('#out').scrollIntoView({behavior:'smooth'});
  }catch(e){msg(e.message,1)}
  $('#go').disabled=false;
}

function show(){
  $('#out').classList.remove('hidden');
  var els=data.elements||[];
  $('#els').innerHTML=els.length?els.map(function(e){
    return '<label>'+esc(e.label)+'</label><input type="text" data-id="'+esc(e.id)+'" value="'+esc(vals[e.id])+'">';
  }).join(''):'<span class="sub">Aucun élément interchangeable repéré.</span>';
  $('#els').querySelectorAll('input').forEach(function(i){
    i.addEventListener('input',function(){vals[i.dataset.id]=i.value;persist();scenes()});
  });
  $('#chars').innerHTML=(data.personnages||[]).map(function(p,i){
    return '<div class="chip"><b>'+esc(p.nom)+'</b><span>'+esc(p.description)+'</span><div class="phw">'+phH('c'+i)+'</div></div>';
  }).join('');
  scenes();
}

function phH(k){
  if(imgs[k])return '<img class="ph" alt="" src="'+imgs[k]+'"><div class="acts"><button class="cp ghost" data-ph="'+k+'">Remplacer</button><button class="cp ghost" data-rm="'+k+'">Retirer</button></div>';
  return '<button class="cp ghost" data-ph="'+k+'">Ajouter ma photo</button>';
}
function box(titre,txt){
  return '<div class="box"><div class="bt"><span>'+titre+'</span><button class="cp">Copier</button></div><pre>'+esc(txt)+'</pre></div>';
}

function scenes(){
  $('#scenes').innerHTML=(data.scenes||[]).map(function(s,i){
    var clip=sub(s.prompt_clip)+' Dialogue : "'+sub(s.parole)+'"';
    return '<section class="scene" data-i="'+i+'">'+
      '<div class="head"><span class="num">'+(i+1)+'</span><h3>'+esc(sub(s.titre))+'</h3><span class="ref">Réf. '+esc(s.ref)+'</span></div>'+
      box('Image Google Flow',sub(s.prompt_image))+
      '<div class="phw">'+phH('s'+i)+'</div>'+
      '<div class="dlg"><p>'+esc(sub(s.dialogue))+'</p><button class="cp ghost" data-act="refo">Reformuler</button></div>'+
      box('Clip Google Flow',clip)+
      '</section>';
  }).join('');
}

document.addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.ph){phKey=b.dataset.ph;$('#phin').value='';$('#phin').click();return}
  if(b.dataset.rm){delete imgs[b.dataset.rm];idbSet(imgs);show();return}
  if(b.classList.contains('cp')&&!b.dataset.act){
    var t=b.closest('.box').querySelector('pre').textContent;
    var ok=function(){var o=b.textContent;b.textContent='Copié';setTimeout(function(){b.textContent=o},1200)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok,function(){fallback(t);ok()})}else{fallback(t);ok()}
  }
  if(b.dataset.act==='refo'){refo(+b.closest('.scene').dataset.i,b)}
});
function fallback(t){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}

async function refo(i,b){
  var s=data.scenes[i];b.textContent='…';b.disabled=true;
  try{
    var r=await gem([{text:'Reformule ce dialogue en français avec des mots différents, même idée, même ton, même longueur à peu près. Garde les marqueurs {{e1}} etc. tels quels. Réponds uniquement avec un JSON {"dialogue":"","parole":""}. dialogue (scène racontée avec la réplique entre « ») : '+s.dialogue+' | parole (réplique seule) : '+s.parole}]);
    if(r.dialogue)s.dialogue=r.dialogue;if(r.parole)s.parole=r.parole;
    persist();scenes();
  }catch(e){msg(e.message,1);b.textContent='Reformuler';b.disabled=false}
}

$('#file').addEventListener('change',function(){var f=this.files[0];$('#fname').textContent=f?f.name+' ('+(f.size/1e6).toFixed(1)+' Mo)':'MP4 ou MOV, 18 Mo maximum'});
$('#go').addEventListener('click',analyse);
$('#phin').addEventListener('change',function(){
  var f=this.files[0];if(!f||!phKey)return;var k=phKey;var u=URL.createObjectURL(f);var im=new Image();
  im.onload=function(){
    var m=900,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    imgs[k]=c.toDataURL('image/jpeg',.85);URL.revokeObjectURL(u);idbSet(imgs);show();
  };
  im.onerror=function(){msg('Image illisible, essaie une autre photo.',1)};
  im.src=u;
});
</script>
</body>
</html>
