<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Métaprompt Fruit"><title>Expert métaprompt fruit IA</title>
<style>
:root{--a:#ff6b4a;--bg:#fff8f3;--c:#fff;--t:#2b2220;--m:#8a7b75;--l:#f0e2da}
@media(prefers-color-scheme:dark){:root{--bg:#1b1514;--c:#2a2120;--t:#f6ece8;--m:#a8978f;--l:#3b2f2c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px -apple-system,system-ui,sans-serif}
#app{padding:calc(14px + env(safe-area-inset-top)) 14px 100px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:17px;margin:16px 0 8px}
.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:12px;margin:10px 0}
.b{background:var(--a);color:#fff;border:0;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:600;margin:3px 3px 3px 0}
.b.g{background:var(--l);color:var(--t)}.b.s{padding:7px 10px;font-size:13px}.b.w{width:100%}
.chip{display:inline-block;border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:20px;padding:8px 12px;margin:3px 3px 3px 0;font-size:14px}.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
input,textarea,select{width:100%;border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:10px;padding:10px;font:inherit;margin:4px 0}textarea{min-height:90px}
label{font-size:13px;color:var(--m)}.m{color:var(--m);font-size:13px}.hb{background:none;border:0;font-size:22px;float:right}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--l);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 0;font-size:11px;color:var(--m)}nav button.on{color:var(--a);font-weight:700}nav span{display:block;font-size:20px}
.busy{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;text-align:center;padding:30px;z-index:9}
.modal{position:fixed;inset:0;background:#000a;z-index:8;overflow:auto;padding:calc(20px + env(safe-area-inset-top)) 12px}.modal>div{background:var(--bg);border-radius:18px;padding:14px}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;opacity:0;transition:.3s;z-index:20;pointer-events:none}
img.th{width:64px;height:64px;object-fit:cover;border-radius:12px;float:left;margin-right:10px}pre{white-space:pre-wrap;font:13px inherit;margin:6px 0}details{margin:6px 0}
</style></head><body><div id="app"></div><nav id="nav"></nav><div id="toast"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const db=new Promise((ok,ko)=>{const r=indexedDB.open('emfia',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)});
const idb=(m,f)=>db.then(d=>new Promise((ok,ko)=>{const t=d.transaction('kv',m),r=f(t.objectStore('kv'));t.oncomplete=()=>ok(r.result);t.onerror=()=>ko(t.error)}));
const kvGet=k=>idb('readonly',s=>s.get(k)),kvSet=(k,v)=>idb('readwrite',s=>s.put(v,k));
let S={projects:[],chars:[],styles:[],settings:{key:'',model:'gemini-2.5-flash'}},V={tab:'home',pid:null,lib:'chars',fav:'all',modal:null,busy:'',edit:null},T;
const P=()=>S.projects.find(p=>p.id===V.pid),pp=b=>S.projects.find(x=>x.id===(b.dataset.p||V.pid));
const save=()=>{clearTimeout(T);T=setTimeout(()=>Promise.all(Object.keys(S).map(k=>kvSet(k,S[k]))),250)};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,2400)};
const copy=async t=>{try{await navigator.clipboard.writeText(t)}catch{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}toast('Copié ✓')};
const GENRES=['Comédie du quotidien','Amour et trahison','Drame familial','Prison et aventures','Télé-réalité','Autre thème'];
const RULES="Format vertical 9:16. Durée de chaque séquence : 4 à 6 secondes. Personnages toujours visibles de face ou de trois quarts, jamais de dos. Plans suffisamment reculés pour voir les personnages et leurs actions, pas de gros plans inutiles. Aucune musique ajoutée. Aucun texte ni sous-titre incrusté à l'écran. Dialogues cohérents, attribués au bon personnage. Apparences, accessoires et décors identiques d'une scène à l'autre.";
const SYS="Tu es un scénariste expert de courtes vidéos TikTok mettant en scène des fruits anthropomorphes en animation 3D. Les histoires s'inspirent de vraies situations humaines (héritages, infidélités, jalousies, secrets, argent, vengeances) et l'humour naît du décalage avec des personnages fruits, sans absurdité gratuite. Intrigues compréhensibles, dialogues naturels, rebondissements. Tu réponds uniquement en JSON valide, en français, sans tiret long.";
async function gem(parts,json=true,sys){const{key,model}=S.settings;if(!key)throw new Error('Ajoute ta clé Gemini dans Réglages.');
const body={contents:[{role:'user',parts}],generationConfig:{temperature:1,maxOutputTokens:32000,...(json?{responseMimeType:'application/json'}:{})}};if(sys)body.systemInstruction={parts:[{text:sys}]};
const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
const j=await r.json();if(!r.ok)throw new Error(j.error?.message||'Erreur '+r.status);const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');if(!t)throw new Error('Réponse vide de Gemini');
try{return JSON.parse(t.replace(/^```json|```$/g,'').trim())}catch{throw new Error('Réponse incomplète ou invalide, réessaie.')}}
const imgData=f=>new Promise(ok=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.82))};i.src=r.result};r.readAsDataURL(f)});
const b64=u=>({inlineData:{mimeType:'image/jpeg',data:u.split(',')[1]}});
const charTxt=c=>`${c.name} (${c.fruit}) : ${c.desc}. Accessoires permanents : ${c.acc}. Traits visuels : ${c.traits}. Référence : ${c.prompt}`;
const ctx=p=>{const q=p.q,cs=q.chars.map(id=>S.chars.find(c=>c.id===id)).filter(Boolean),st=S.styles.find(s=>s.id===q.style);return{cs,st,txt:`Genre : ${q.genre==='Autre thème'?q.custom:q.genre}\nNombre de parties : ${q.parts}\nPersonnages de la bibliothèque :\n${cs.map(charTxt).join('\n')||'aucun'}\nNouveaux personnages à imaginer : ${q.newc||'aucun'}\nStyle visuel : ${st?st.name+' : '+st.prompt+' '+st.fiche:'animation 3D de fruits anthropomorphes'}\nInstructions : ${q.extra||'aucune'}`}};
const heart=(on,a,id,p)=>`<button class="hb" data-a="${a}" data-id="${id||''}" data-p="${p||''}">${on?'❤️':'🤍'}</button>`;
const sceneTxt=s=>`${s.prompt_grok}\nDialogues :\n${s.dialogues||'aucun'}\nRègles : ${RULES}`;
const partTxt=(p,i)=>{const t=p.story.parties[i];return`PARTIE ${i+1} : ${t.titre}\nRésumé : ${t.resume}\nFin : ${t.fin}\n\n`+t.scenes.map((s,j)=>`--- Scène ${i+1}.${j+1} (${s.lieu}, 4 à 6 s) ---\n${sceneTxt(s)}`).join('\n\n')};
const metaTxt=p=>{const c=ctx(p);return`RÔLE\nTu es un réalisateur et prompt engineer spécialisé en vidéos verticales d'animation 3D de fruits anthropomorphes.\n\nOBJECTIF\nProduire dans Grok les séquences de l'histoire "${p.story.titre}", scène par scène, avec une cohérence parfaite.\n\nCONTEXTE\n${p.chosen.synopsis}\n\nRÉFÉRENCES VISUELLES\nStyle : ${c.st?c.st.prompt:'animation 3D'}\n${c.cs.map(charTxt).join('\n')}\n\nRÈGLES DE COHÉRENCE (fiche de continuité)\n${JSON.stringify(p.story.continuite,null,1)}\n\nCONTRAINTES TECHNIQUES\n${RULES}\n\nDÉROULEMENT\n${p.story.parties.map((_,i)=>partTxt(p,i)).join('\n\n=====\n\n')}\n\nRÉSULTAT ATTENDU\nUne séquence vidéo par scène, fidèle aux apparences, décors et dialogues ci-dessus, sans musique ni texte à l'écran.`};
const newP=()=>{const p={id:uid(),name:'Nouveau projet',status:'Brouillon',fav:false,step:'q',q:{genre:GENRES[0],custom:'',chars:[],newc:'',style:'',parts:1,extra:''},props:[],kept:[],chosen:null,story:null,corr:[],mp:false,upd:Date.now()};S.projects.unshift(p);V.pid=p.id;V.tab='create';save();render()};
async function genProps(){const p=P();V.busy='Gemini écrit 3 histoires…';render();try{const r=await gem([{text:`${ctx(p).txt}\n\nPropose 3 histoires réellement différentes. JSON : {"histoires":[{"titre":"","synopsis":"","intrigue":"","conflits":"","rebondissement":""}]}`}],true,SYS);p.props=(r.histoires||[]).slice(0,3).map(h=>({...h,id:uid()}));p.step='props'}catch(e){toast(e.message)}V.busy='';save();render()}
async function develop(){const p=P(),c=ctx(p);V.busy="Gemini construit l'histoire…";render();try{
p.story=await gem([{text:`${c.txt}\n\nHistoire choisie : ${JSON.stringify(p.chosen)}\n\nDéveloppe-la en ${p.q.parts} partie(s) de 6 à 8 scènes courtes (4 à 6 s). Chaque partie a une fin satisfaisante ou un point d'arrêt cohérent, la suite reste facultative. Continuité parfaite. "prompt_grok" est un prompt vidéo complet et autonome : décor, action précise, émotions, tenue et apparence des personnages présents, style visuel, point de départ = image de départ fournie. N'y mets pas les règles techniques générales.\nJSON : {"titre":"","continuite":{"personnages":[{"nom":"","fruit":"","tenue":"","accessoires":"","sait":"","motivation":""}],"lieux":[""],"objets":[{"objet":"","proprietaire":"","lieu":""}],"relations":[""],"chronologie":[""]},"parties":[{"titre":"","resume":"","fin":"","scenes":[{"lieu":"","action":"","dialogues":"NOM : réplique (une par ligne)","emotions":"","etat":"état de continuité après la scène","prompt_grok":""}]}]}`}],true,SYS);
if(p.name==='Nouveau projet')p.name=p.story.titre||p.chosen.titre;p.step='story';p.status='En cours';p.corr=[];save();V.busy='Vérification de cohérence…';render();await check(true)}catch(e){toast(e.message)}V.busy='';save();render()}
async function check(silent){const p=P();if(!silent){V.busy='Vérification de cohérence…';render()}try{const r=await gem([{text:`Audite cette histoire : chronologie, lieux, déplacements, objets et propriétaires, tenues, événements passés, savoir de chaque personnage, relations, motivations, attribution des dialogues. Corrige toutes les contradictions (y compris dans prompt_grok et la fiche de continuité) en modifiant le moins possible. Garde exactement la même structure.\nHistoire : ${JSON.stringify(p.story)}\nJSON : {"problemes":[{"scene":"","probleme":"","correction":""}],"histoire":<histoire complète corrigée>}`}],true,SYS);if(r.histoire?.parties)p.story=r.histoire;p.corr=r.problemes||[];toast(p.corr.length?p.corr.length+' correction(s) faite(s)':'Aucune contradiction')}catch(e){toast(e.message)}if(!silent){V.busy='';save();render()}}
function home(){const k=!S.settings.key;return`<h1>🍉 Expert métaprompt fruit IA</h1>${k?'<div class="card">Première étape : ajoute ta clé Gemini dans <b>Réglages</b>.<br><button class="b s" data-a="go" data-id="set">Ouvrir Réglages</button></div>':''}<button class="b w" data-a="new">✨ Nouveau projet</button><button class="b g w" data-a="go" data-id="proj">📁 Mes projets</button><button class="b g w" data-a="go" data-id="fav">❤️ Mes favoris</button><button class="b g w" data-a="go" data-id="set">⚙️ Réglages et sauvegarde</button><h2>Récents</h2>${S.projects.slice(0,3).map(projCard).join('')||'<p class="m">Aucun projet pour le moment.</p>'}`}
function create(){const p=P();if(!p)return`<h1>Créer une histoire</h1><button class="b w" data-a="new">✨ Nouveau projet</button>`;if(p.step==='story'&&p.story)return story(p);const q=p.q;
if(p.step==='props')return`<h1>3 histoires au choix</h1>${p.props.map(h=>propCard(h)).join('')}<button class="b w" data-a="gen">🔄 Régénérer 3 nouvelles</button><button class="b g w" data-a="back">✏️ Modifier mes choix</button>${p.kept.length?'<h2>Mises de côté</h2>'+p.kept.map(h=>propCard(h,1)).join(''):''}`;
return`<h1>Nouvelle histoire</h1><h2>Genre</h2>${GENRES.map(g=>`<span class="chip ${q.genre===g?'on':''}" data-a="q" data-k="genre" data-id="${g}">${g}</span>`).join('')}${q.genre==='Autre thème'?`<input data-m="q.custom" placeholder="Ton thème" value="${esc(q.custom)}">`:''}
<h2>Personnages</h2>${S.chars.map(c=>`<span class="chip ${q.chars.includes(c.id)?'on':''}" data-a="qc" data-id="${c.id}">${esc(c.name)}</span>`).join('')||'<p class="m">Bibliothèque vide : décris-les ci-dessous.</p>'}<textarea data-m="q.newc" placeholder="Nouveaux personnages à imaginer (facultatif)">${esc(q.newc)}</textarea>
<h2>Style visuel</h2><span class="chip ${!q.style?'on':''}" data-a="q" data-k="style" data-id="">Libre</span>${S.styles.map(s=>`<span class="chip ${q.style===s.id?'on':''}" data-a="q" data-k="style" data-id="${s.id}">${esc(s.name)}</span>`).join('')}
<h2>Nombre de parties</h2>${[1,2,3].map(n=>`<span class="chip ${q.parts===n?'on':''}" data-a="q" data-k="parts" data-id="${n}">${n}</span>`).join('')}
<h2>Instructions</h2><textarea data-m="q.extra" placeholder="Tes envies (facultatif)">${esc(q.extra)}</textarea><button class="b w" data-a="gen">✨ Générer 3 histoires</button>`}
function propCard(h,k){return`<div class="card">${heart(h.fav,'favProp',h.id)}<b>${esc(h.titre)}</b><p>${esc(h.synopsis)}</p><p class="m"><b>Intrigue :</b> ${esc(h.intrigue)}<br><b>Conflits :</b> ${esc(h.conflits)}<br><b>Rebondissement :</b> ${esc(h.rebondissement)}</p><button class="b s" data-a="choose" data-id="${h.id}">✅ Choisir</button><button class="b s g" data-a="saveProp" data-id="${h.id}">${h.saved?'📌 Retirer':'📌 Enregistrer'}</button></div>`}
function story(p){const s=p.story,c=s.continuite||{};return`<h1>${esc(p.name)}</h1>${heart(p.fav,'favP')}<div><select data-c="status">${['Brouillon','En cours','Terminé'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
<button class="b s" data-a="copyMeta">📋 Copier le métaprompt complet</button><button class="b s g" data-a="favM">${p.mp?'❤️':'🤍'} Métaprompt</button><button class="b s g" data-a="check">🔍 Vérifier la cohérence</button><button class="b s g" data-a="dup" data-id="${p.id}">⧉ Dupliquer</button><button class="b s g" data-a="saveNow">💾 Enregistrer</button>
${p.corr?.length?`<details><summary>${p.corr.length} correction(s) de cohérence</summary>${p.corr.map(x=>`<pre><b>${esc(x.scene)}</b> ${esc(x.probleme)}\n→ ${esc(x.correction)}</pre>`).join('')}</details>`:''}
<details><summary>Fiche de continuité</summary><pre>${esc(JSON.stringify(c,null,1))}</pre></details>
${s.parties.map((t,i)=>`<h2>Partie ${i+1} : ${esc(t.titre)}</h2><p class="m">${esc(t.resume)}<br><b>Fin :</b> ${esc(t.fin)}</p><button class="b s g" data-a="copyPart" data-id="${i}">📋 Copier la partie</button>${t.scenes.map((x,j)=>V.edit===i+'.'+j?editScene(x):`<div class="card">${heart(x.fav,'favSc',i+'.'+j)}<b>Scène ${i+1}.${j+1}</b> <span class="m">${esc(x.lieu)}</span><p>${esc(x.action)}</p><pre>${esc(x.dialogues)}</pre><details><summary class="m">Prompt Grok</summary><pre>${esc(x.prompt_grok)}</pre></details><button class="b s" data-a="copyScene" data-id="${i}.${j}">📋 Copier</button><button class="b s g" data-a="editScene" data-id="${i}.${j}">✏️ Modifier</button></div>`).join('')}`).join('')}`}
const editScene=x=>`<div class="card"><input id="e_l" value="${esc(x.lieu)}"><textarea id="e_a">${esc(x.action)}</textarea><textarea id="e_d">${esc(x.dialogues)}</textarea><textarea id="e_p">${esc(x.prompt_grok)}</textarea><button class="b s" data-a="saveScene">Valider</button><button class="b s g" data-a="cancelEdit">Annuler</button></div>`;
const searchBar=`<input placeholder="🔎 Rechercher" data-m="search">`;
function lib(){const ch=V.lib==='chars',L=ch?S.chars:S.styles;return`<h1>Bibliothèque</h1><span class="chip ${ch?'on':''}" data-a="libTab" data-id="chars">Personnages</span><span class="chip ${!ch?'on':''}" data-a="libTab" data-id="styles">Styles</span>${searchBar}<button class="b w" data-a="addLib">➕ Ajouter ${ch?'un personnage':'un style'}</button>${L.map(x=>`<div class="card it">${heart(x.fav,ch?'favC':'favS',x.id)}${x.photo?`<img class="th" src="${x.photo}">`:''}<b>${esc(x.name)}</b><div class="m">${esc(ch?x.fruit:(x.fiche||'').slice(0,80))}</div><div style="clear:both"></div><button class="b s g" data-a="editLib" data-id="${x.id}">✏️ Modifier</button><button class="b s g" data-a="copyLib" data-id="${x.id}">📋 Prompt</button><button class="b s g" data-a="delLib" data-id="${x.id}">🗑</button></div>`).join('')||'<p class="m">Rien pour le moment.</p>'}`}
function modal(){const m=V.modal,ch=m.t==='char',o=m.o||{};return`<div class="modal"><div><h2>${ch?'Personnage':'Style visuel'}</h2><input type="file" accept="image/*" id="m_file" data-c="file">${m.photo?`<img src="${m.photo}" style="width:100%;border-radius:12px;margin:6px 0">`:''}<button class="b s g" data-a="analyze">🔬 Analyser la photo avec Gemini</button><label>Nom</label><input id="m_name" value="${esc(o.name)}">${ch?`<label>Type de fruit</label><input id="m_fruit" value="${esc(o.fruit)}"><label>Description physique</label><textarea id="m_desc">${esc(o.desc)}</textarea><label>Accessoires permanents</label><textarea id="m_acc">${esc(o.acc)}</textarea><label>Caractéristiques visuelles</label><textarea id="m_traits">${esc(o.traits)}</textarea>`:`<label>Fiche de style</label><textarea id="m_fiche" style="min-height:160px">${esc(o.fiche)}</textarea>`}<label>Prompt de référence</label><textarea id="m_prompt">${esc(o.prompt)}</textarea><button class="b" data-a="saveLib">Valider</button><button class="b g" data-a="closeModal">Annuler</button></div></div>`}
function projCard(p){return`<div class="card it">${heart(p.fav,'favP','',p.id)}<b>${esc(p.name)}</b><div class="m">${p.status} · ${p.story?p.story.parties.length+' partie(s)':'questionnaire'}</div><button class="b s" data-a="open" data-id="${p.id}">▶ Reprendre</button><button class="b s g" data-a="rename" data-id="${p.id}">✏️</button><button class="b s g" data-a="dup" data-id="${p.id}">⧉</button><button class="b s g" data-a="delP" data-id="${p.id}">🗑</button></div>`}
function proj(){return`<h1>Mes projets</h1>${searchBar}${['En cours','Brouillon','Terminé'].map(s=>{const l=S.projects.filter(p=>p.status===s);return l.length?`<h2>${s}</h2>`+l.map(projCard).join(''):''}).join('')||'<p class="m">Aucun projet.</p>'}`}
function fav(){const it=[],F=V.fav;S.chars.filter(x=>x.fav).forEach(x=>it.push(['Personnages',x.name,'favC',x.id,'',`<button class="b s g" data-a="copyLib" data-id="${x.id}">📋</button>`]));S.styles.filter(x=>x.fav).forEach(x=>it.push(['Styles',x.name,'favS',x.id,'',`<button class="b s g" data-a="copyLib" data-id="${x.id}">📋</button>`]));
S.projects.forEach(p=>{if(p.fav)it.push(['Histoires',p.name,'favP','',p.id,`<button class="b s" data-a="open" data-id="${p.id}">▶</button>`]);[...p.props,...p.kept].filter(h=>h.fav).forEach(h=>it.push(['Histoires','💡 '+h.titre,'favProp',h.id,p.id,`<button class="b s" data-a="open" data-id="${p.id}">▶</button>`]));if(p.mp&&p.story)it.push(['Métaprompts','Métaprompt : '+p.name,'favM','',p.id,`<button class="b s g" data-a="copyMeta" data-p="${p.id}">📋</button>`]);p.story?.parties.forEach((t,i)=>t.scenes.forEach((x,j)=>x.fav&&it.push(['Scènes',`${p.name}, scène ${i+1}.${j+1}`,'favSc',i+'.'+j,p.id,`<button class="b s g" data-a="copyScene" data-id="${i}.${j}" data-p="${p.id}">📋</button>`])))});
return`<h1>Mes favoris</h1>${['all','Personnages','Styles','Histoires','Métaprompts','Scènes'].map(f=>`<span class="chip ${F===f?'on':''}" data-a="favF" data-id="${f}">${f==='all'?'Tout':f}</span>`).join('')}${it.filter(x=>F==='all'||x[0]===F).map(x=>`<div class="card">${heart(1,x[2],x[3],x[4])}<span class="m">${x[0]}</span><br><b>${esc(x[1])}</b><br>${x[5]}</div>`).join('')||'<p class="m">Aucun favori.</p>'}`}
function set(){const s=S.settings;return`<h1>Réglages</h1><div class="card"><label>Clé API Gemini</label><input type="password" data-m="s.key" value="${esc(s.key)}" placeholder="AIza..."><label>Modèle Gemini</label><input data-m="s.model" value="${esc(s.model)}"><p class="m">La clé reste uniquement dans le stockage de cet appareil (jamais dans le code). Ce n'est pas un coffre-fort : dans Google AI Studio, restreins-la à ton adresse github.io.</p></div><div class="card"><b>Sauvegarde</b><p class="m">Tout est enregistré sur cet iPhone (base du navigateur). Safari peut effacer les données d'un site peu utilisé : ajoute l'appli à l'écran d'accueil et fais régulièrement une sauvegarde de secours.</p><button class="b s" data-a="export">⬇️ Sauvegarde de secours</button><button class="b s g" data-a="import">⬆️ Restaurer</button><button class="b s g" data-a="persist">🔒 Stockage durable</button><input type="file" id="imp" accept=".json" data-c="imp" hidden></div>`}
function nav(){$('#nav').innerHTML=[['home','🏠','Accueil'],['create','✨','Histoire'],['lib','🍓','Biblio'],['proj','📁','Projets'],['fav','❤️','Favoris']].map(([k,i,l])=>`<button class="${V.tab===k?'on':''}" data-a="go" data-id="${k}"><span>${i}</span>${l}</button>`).join('')}
function render(){const v={home,create,lib,proj,fav,set}[V.tab];$('#app').innerHTML=v()+(V.modal?modal():'')+(V.busy?`<div class="busy">${esc(V.busy)}</div>`:'');nav()}
const g=i=>$('#'+i)?.value||'';
const setProp=(id,k)=>{const p=P();let v;[...p.props,...p.kept].filter(h=>h.id===id).forEach(h=>{if(v===undefined)v=!h[k];h[k]=v});const h=p.props.find(h=>h.id===id)||p.kept.find(h=>h.id===id);if(!h.saved&&!h.fav)p.kept=p.kept.filter(x=>x.id!==id);else if(!p.kept.some(x=>x.id===id))p.kept.push({...h})};
const A={go:id=>{V.tab=id;V.edit=null;render()},new:newP,gen:genProps,check:()=>check(),develop,
q:(id,b)=>{const q=P().q,k=b.dataset.k;q[k]=k==='parts'?+id:id;save();render()},qc:id=>{const q=P().q;q.chars=q.chars.includes(id)?q.chars.filter(x=>x!==id):[...q.chars,id];save();render()},
back:()=>{P().step='q';save();render()},choose:id=>{const p=P();p.chosen=[...p.props,...p.kept].find(h=>h.id===id);develop()},saveProp:id=>{setProp(id,'saved');save();render()},favProp:(id,b)=>{V.pid=b.dataset.p||V.pid;setProp(id,'fav');save();render()},
favP:(id,b)=>{const p=pp(b);p.fav=!p.fav;save();render()},favM:(id,b)=>{const p=pp(b);p.mp=!p.mp;save();render()},favSc:(id,b)=>{const[i,j]=id.split('.'),x=pp(b).story.parties[i].scenes[j];x.fav=!x.fav;save();render()},
favC:id=>{const c=S.chars.find(x=>x.id===id);c.fav=!c.fav;save();render()},favS:id=>{const c=S.styles.find(x=>x.id===id);c.fav=!c.fav;save();render()},favF:id=>{V.fav=id;render()},
copyMeta:(_,b)=>copy(metaTxt(pp(b))),copyPart:id=>copy(partTxt(P(),+id)),copyScene:(id,b)=>{const[i,j]=id.split('.');copy(sceneTxt(pp(b).story.parties[i].scenes[j]))},
editScene:id=>{V.edit=id;render()},cancelEdit:()=>{V.edit=null;render()},saveScene:()=>{const[i,j]=V.edit.split('.'),x=P().story.parties[i].scenes[j];x.lieu=g('e_l');x.action=g('e_a');x.dialogues=g('e_d');x.prompt_grok=g('e_p');V.edit=null;save();render();toast('Modifié. Relance la vérification si besoin.')},
saveNow:()=>{P().upd=Date.now();save();toast('Enregistré ✓ (sur cet appareil)')},open:id=>{V.pid=id;V.tab='create';render()},rename:id=>{const p=S.projects.find(x=>x.id===id),n=prompt('Nouveau nom',p.name);if(n){p.name=n;save();render()}},
dup:id=>{const p=JSON.parse(JSON.stringify(S.projects.find(x=>x.id===id)));p.id=uid();p.name+=' (copie)';p.status='Brouillon';p.fav=false;p.mp=false;S.projects.unshift(p);V.pid=p.id;V.tab='create';save();render();toast('Copie créée, l\'original est intact')},delP:id=>{if(confirm('Supprimer ce projet ?')){S.projects=S.projects.filter(p=>p.id!==id);if(V.pid===id)V.pid=null;save();render()}},
libTab:id=>{V.lib=id;render()},addLib:()=>{V.modal={t:V.lib==='chars'?'char':'style',o:{},photo:''};render()},editLib:id=>{const o=[...S.chars,...S.styles].find(x=>x.id===id);V.modal={t:V.lib==='chars'?'char':'style',o,photo:o.photo,id};render()},closeModal:()=>{V.modal=null;render()},
copyLib:id=>{const o=[...S.chars,...S.styles].find(x=>x.id===id);copy(S.chars.includes(o)?charTxt(o):o.name+'\n'+o.fiche+'\n'+o.prompt)},delLib:id=>{if(confirm('Supprimer ?')){S.chars=S.chars.filter(x=>x.id!==id);S.styles=S.styles.filter(x=>x.id!==id);save();render()}},
analyze:async()=>{const m=V.modal;if(!m.photo)return toast('Choisis une photo');const ch=m.t==='char';const keep=['m_name','m_fruit','m_desc','m_acc','m_traits','m_fiche','m_prompt'];V.busy='Gemini analyse la photo…';const snap={};keep.forEach(k=>snap[k]=g(k));
try{const r=await gem([b64(m.photo),{text:ch?`Analyse ce fruit anthropomorphe en 3D. JSON : {"fruit":"","description":"physique précis : forme, couleur, texture, visage, yeux, bouche, membres, proportions","accessoires":"","traits":"caractéristiques visuelles","prompt_reference":"prompt détaillé réutilisable pour recréer ce personnage fidèlement"}`:`Analyse le style graphique de cette image d'animation 3D : textures, matières (glossy, cristal, diamant, mat), proportions, formes des visages, yeux et expressions, couleurs, reflets, éclairage, rendu général. JSON : {"fiche":"une ligne par critère, format Critère : description","prompt_reference":"prompt de style détaillé à appliquer à tous les personnages"}`}],true,SYS);
m.o={...m.o,name:snap.m_name,fruit:r.fruit||snap.m_fruit,desc:r.description||snap.m_desc,acc:r.accessoires||snap.m_acc,traits:r.traits||snap.m_traits,fiche:r.fiche||snap.m_fiche,prompt:r.prompt_reference||snap.m_prompt}}catch(e){toast(e.message);m.o={...m.o,name:snap.m_name,fruit:snap.m_fruit,desc:snap.m_desc,acc:snap.m_acc,traits:snap.m_traits,fiche:snap.m_fiche,prompt:snap.m_prompt}}V.busy='';render()},
saveLib:()=>{const m=V.modal,ch=m.t==='char',L=ch?S.chars:S.styles,o=ch?{name:g('m_name')||'Sans nom',fruit:g('m_fruit'),desc:g('m_desc'),acc:g('m_acc'),traits:g('m_traits'),prompt:g('m_prompt')}:{name:g('m_name')||'Sans nom',fiche:g('m_fiche'),prompt:g('m_prompt')};o.photo=m.photo;if(m.id)Object.assign(L.find(x=>x.id===m.id),o);else L.unshift({id:uid(),fav:false,...o});V.modal=null;save();render()},
export:()=>{const d={...S,settings:{...S.settings,key:''}},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='sauvegarde-metaprompt-fruit.json';a.click()},import:()=>$('#imp').click(),persist:async()=>toast(await navigator.storage?.persist?.()?'Stockage durable accordé':'Non accordé par Safari, utilise les sauvegardes')};
const C={status:(b)=>{P().status=b.value;save()},file:async b=>{V.modal.photo=await imgData(b.files[0]);const keep={};['m_name','m_fruit','m_desc','m_acc','m_traits','m_fiche','m_prompt'].forEach(k=>keep[k]=g(k));Object.assign(V.modal.o,{name:keep.m_name,fruit:keep.m_fruit,desc:keep.m_desc,acc:keep.m_acc,traits:keep.m_traits,fiche:keep.m_fiche,prompt:keep.m_prompt});render()},
imp:async b=>{try{const d=JSON.parse(await b.files[0].text());S.projects=d.projects||[];S.chars=d.chars||[];S.styles=d.styles||[];save();render();toast('Restauré ✓')}catch{toast('Fichier invalide')}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.id,b)});
document.addEventListener('change',e=>{const b=e.target.closest('[data-c]');if(b&&C[b.dataset.c])C[b.dataset.c](b)});
document.addEventListener('input',e=>{const t=e.target.dataset.m;if(!t)return;const[k,f]=t.split('.');if(k==='q'){P().q[f]=e.target.value;save()}else if(k==='s'){S.settings[f]=e.target.value.trim();save()}else{const s=e.target.value.toLowerCase();document.querySelectorAll('.it').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(s)?'':'none')}});
(async()=>{for(const k of Object.keys(S)){const v=await kvGet(k);if(v)S[k]=v}render()})();
</script></body></html>
