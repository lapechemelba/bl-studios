<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Studio TikTok · B&L Studios I.A.</title>
<style>
:root{--or:#D4A575;--ro:#EFC99F;--cl:#FBE6C7;--br:#865E3C;--et:#FFF0CF;--li:#2a1f15;--ca:#0c0905}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--cl);font:16px/1.45 system-ui,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 calc(70px + env(safe-area-inset-bottom,0))}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--li)}
header a{color:var(--or);text-decoration:none;font-size:14px}
header b{flex:1;font:600 21px Georgia,serif;color:var(--or)}
main{max-width:640px;margin:0 auto;padding:16px}
section{display:none}section.on{display:block}
h2{font:600 24px Georgia,serif;color:var(--or);margin:0 0 10px}
h3{margin:0;font-size:16px;color:var(--et)}
.c{background:var(--ca);border:1px solid var(--li);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--ro);margin:10px 0 5px}
input,select,textarea{width:100%;background:#000;color:var(--cl);border:1px solid var(--br);border-radius:12px;padding:11px;font:inherit}
textarea{min-height:90px}
button{font:inherit;cursor:pointer}
.b{width:100%;padding:13px;border:0;border-radius:14px;background:linear-gradient(to right,#865E3C,#D4A575,#FFF0CF,#EFC99F,#865E3C);color:#1a1008;font-weight:600;margin-top:10px}
.b:disabled{opacity:.5}
.g{background:#000;color:var(--or);border:1px solid var(--br);border-radius:12px;padding:9px 12px}
.r{display:flex;gap:8px}.r>*{flex:1}
.n{font-size:13px;color:var(--or);min-height:18px}
pre{white-space:pre-wrap;word-break:break-word;font:13px/1.5 system-ui,sans-serif;margin:8px 0;color:var(--cl)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#000;border-top:1px solid var(--li);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;border:0;color:var(--br);padding:14px 4px}
nav button.on{color:var(--et)}
#t{position:fixed;left:16px;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0));background:var(--cl);color:#1a1008;padding:12px;border-radius:12px;display:none}
:focus-visible{outline:2px solid var(--et);outline-offset:2px}
</style></head><body>
<header><a href="index.html">‹ Studio</a><b>Studio TikTok</b></header>
<main>
<section id="s-c" class="on">
<h2>Créer une production</h2>
<div class="c">
<label style="margin-top:0">Univers</label>
<select id="u"><option>Fruits IA</option><option>Next and Chill</option></select>
<label>Mon titre</label>
<input id="ti" placeholder="Ex : Une banane se fait arrêter pour excès de vitesse">
<div class="r"><button class="b" id="go">Générer</button><button class="b" id="su">Surprends-moi</button></div>
<p class="n" id="st"></p>
</div>
<div id="out"></div>
</section>
<section id="s-r">
<h2>Références</h2>
<div class="c">
<label style="margin-top:0">Lien TikTok (pour mémoire)</label><input id="lk" placeholder="https://www.tiktok.com/…">
<label>Description ou ce que tu vois dans la vidéo</label><textarea id="nt"></textarea>
<label>Stats : vues, likes, commentaires, partages</label><input id="sx" placeholder="Ex : 1,2 M, 90 k, 3 k, 12 k">
<label>Vidéo importée (3 à 60 s conseillé)</label><input id="fv" type="file" accept="video/*">
<button class="b" id="an">Analyser et ajouter</button>
<p class="n">TikTok bloque la lecture des liens : importe la vidéo, ou colle sa description.</p>
</div>
<div class="c"><h3>Profil éditorial</h3><pre id="pf"></pre></div>
<div id="lb"></div>
<h2 style="margin-top:18px">Historique</h2><div id="hs"></div>
</section>
<section id="s-g">
<h2>Règles et réglages</h2>
<div class="c">
<label style="margin-top:0">Règles éditoriales permanentes</label><textarea id="ru" style="min-height:260px"></textarea>
<label>Modèle d’écriture</label><input id="mw">
<label>Modèle de vérification (différent de l’écriture)</label><input id="mc">
<label>Clé API Kie.ai (à saisir une fois ici si l’appli principale ne la partage pas)</label><input id="ky" type="password" autocomplete="off">
<label>Durée d’un bloc</label><select id="du"><option>8</option><option>10</option><option>15</option></select>
<button class="b" id="sv">Enregistrer</button>

</div>
</section>
</main>
<div id="t"></div>
<nav><button class="on" data-t="c">Créer</button><button data-t="r">Références</button><button data-t="g">Règles</button></nav>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{toast('Stockage plein')}};
const RULES0=`Tu conçois des vidéos TikTok humoristiques d’environ 75 secondes, en français, pour maximiser la rétention, les commentaires et les partages, sans promettre de résultat.
Règles : une accroche visuelle et verbale très forte dans les 3 premières secondes, un titre qui intrigue, une action qui démarre tout de suite, des dialogues courts, naturels et dynamiques, un rebondissement régulier, des situations inattendues, un rythme soutenu, une progression dramatique, une curiosité maintenue jusqu’à la fin, une chute mémorable ou une fin ouverte si elle sert l’histoire. L’humour absurde est bienvenu, les erreurs de logique non.
Fruits IA : personnages à tête de fruit ou de légume, corps d’adulte, 3D hyperréaliste de film d’animation, voix en français de Paris.
Next and Chill : extraits de séries ou d’émissions TV reconnaissables, recréés de façon décalée, sans copier de dialogues existants.
Caméra fixe, pas de sous-titres, une seule réplique par plan.`;
let K=L('bl_tt_key','')||L('bl_set',{}).key||'',cfg=Object.assign({mw:'gemini-3-5-flash-openai',mc:'gemini-3-1-pro-openai',d:15,rules:RULES0},L('bl_tt_cfg',{})),hist=L('bl_tt_hist',[]),lib=L('bl_tt_lib',[]),prof=L('bl_tt_prof',''),cur=null;
const toast=m=>{const t=$('#t');t.textContent=m;t.style.display='block';clearTimeout(t._x);t._x=setTimeout(()=>t.style.display='none',4000)};
const st=m=>$('#st').textContent=m,bz=v=>document.querySelectorAll('.b').forEach(b=>b.disabled=v);
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+b.dataset.t));scrollTo(0,0)});

async function ask(model,sys,user,media){
 if(!K)throw Error('Ajoute ta clé Kie dans les Réglages de l’appli principale.');
 const content=media?[{type:'text',text:user},{type:'image_url',image_url:{url:media}}]:user;
 const r=await fetch('https://api.kie.ai/'+model+'/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'system',content:sys},{role:'user',content}],stream:false})});
 const j=await r.json(),t=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
 if(!t)throw Error(j.msg||'Réponse vide du modèle '+model);return t}
const J=t=>JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
const N=()=>Math.ceil(75/cfg.d);
const FMT=`Réponds uniquement en JSON : {"titre":"","accroche":"phrase dite dans les 3 premières secondes","premiere_image":"","legende":"légende TikTok avec hashtags","style":"une ligne de style visuel adaptée au décor","persos":[{"nom":"","tete":"","corps":"","signe":"un détail reconnaissable","voix":"voix, débit, accent"}],"blocs":[{"decor":"","plans":[{"s":4,"cadrage":"plan rapproché de X","action":"","qui":"nom de celui qui parle","visibles":["noms visibles à l’écran"],"ton":"","texte":""}],"sons":"","fin":"image de fin"}]}`;
const sysW=u=>`${cfg.rules}\nUnivers : ${u}.\nProduis ${N()} blocs de ${cfg.d} secondes. Chaque bloc a 3 ou 4 plans dont les durées s font exactement ${cfg.d}, une seule réplique par plan, 2,5 mots par seconde au maximum, et finit sur une mini-chute. Tout personnage qui parle ou apparaît, même sur un écran, figure dans persos.${prof?'\nProfil éditorial à suivre sans copier : '+prof:''}\n${FMT}`;
const sysC=()=>`Tu es un relecteur de scénario indépendant. Vérifie les événements, les dialogues, les intentions des personnages, la chronologie, les contradictions, les personnages absents de la liste, les répliques trop longues (2,5 mots par seconde maximum) et les durées (somme des plans = ${cfg.d} s par bloc). Corrige sans changer le format. Réponds uniquement en JSON : {"problemes":["corrections faites"],"histoire":{l’histoire corrigée, même format}}`;

function ctl(s){const w=[],ns=(s.persos||[]).map(p=>p.nom);(s.blocs||[]).forEach((b,i)=>{const t=b.plans.reduce((a,p)=>a+ +p.s,0);if(t!=cfg.d)w.push(`Bloc ${i+1} : ${t} s au lieu de ${cfg.d} s`);b.plans.forEach((p,k)=>{const n=(p.texte||'').trim().split(/\s+/).length;if(n/p.s>2.8)w.push(`Bloc ${i+1}, plan ${k+1} : réplique trop longue (${n} mots en ${p.s} s)`);[p.qui,...(p.visibles||[])].forEach(x=>{if(x&&!ns.includes(x))w.push(`Bloc ${i+1} : ${x} n’a pas de fiche`)})})});return[...new Set(w)]}
function pr(s,i){const b=s.blocs[i],ns=new Set();let t=0;
 const pl=b.plans.map((p,k)=>{[p.qui,...(p.visibles||[])].forEach(x=>x&&ns.add(x));const a=t;t+=+p.s;return `Plan ${k+1}, de ${a} à ${t} s : ${p.cadrage}, ${p.action}, caméra fixe. ${p.qui} dit en français, d’une voix ${p.ton} : « ${p.texte} » Coupe.`}).join(' ');
 const ch=s.persos.filter(p=>ns.has(p.nom)).map(p=>`${p.nom} : ${p.tete}. ${p.corps}. ${p.signe}. ${p.voix}.`).join(' ');
 return `${s.style}. ${ch} Décor : ${b.decor}. ${pl} Sons : ${b.sons}. Image de fin : ${b.fin}. Pas de sous-titres, pas de texte à l’écran.`.replace(/\.\./g,'.').replace(' Coupe. Sons',' Sons')}
const story=s=>s.blocs.map(b=>b.plans.map(p=>`${p.qui} : ${p.texte}`).join('\n')).join('\n');
function show(){const s=cur;if(!s){$('#out').innerHTML='';return}const w=ctl(s),notes=[...(s._p||[]).map(x=>'Corrigé : '+x),...w.map(x=>'À revoir : '+x)];
 $('#out').innerHTML=`<div class="c"><h3>${e(s.titre)}</h3><pre>Accroche : ${e(s.accroche)}\nPremière image : ${e(s.premiere_image)}\nLégende : ${e(s.legende)}\nPersonnages : ${e(s.persos.map(p=>p.nom).join(', '))}</pre></div>`
 +s.blocs.map((b,i)=>`<div class="c"><h3>${i*cfg.d} s à ${(i+1)*cfg.d} s</h3><pre>${e(pr(s,i))}</pre><div class="r"><button class="g" onclick="cp(${i})">Copier le prompt</button><button class="g" onclick="ed(${i})">Modifier</button></div></div>`).join('')
 +`<div class="c"><h3>Contrôle</h3><pre>${e(notes.join('\n')||'Rien à signaler.')}</pre></div><div class="r"><button class="b" onclick="ca()">Tout copier</button><button class="b" onclick="run(0,1)">Régénérer</button></div>`}
const cb=t=>navigator.clipboard.writeText(t).then(()=>toast('Copié.'),()=>toast('Copie impossible.'));
const cp=i=>cb(pr(cur,i));
const ca=()=>cb([cur.titre,'Accroche : '+cur.accroche,'Légende : '+cur.legende,'',...cur.blocs.map((b,i)=>`--- ${i*cfg.d} à ${(i+1)*cfg.d} s ---\n`+pr(cur,i)),'','L’histoire :',story(cur)].join('\n'));
async function ed(i){const m=prompt('Que veux-tu changer dans ce bloc ?');if(!m)return;bz(true);st('Je modifie le bloc…');
 try{const r=J(await ask(cfg.mw,`Réécris uniquement ce bloc selon la demande, sans changer les personnages ni les autres blocs, et garde ${cfg.d} s au total. Réponds en JSON : un seul bloc au même format. Histoire pour contexte : `+JSON.stringify(cur),`Bloc ${i+1} : `+JSON.stringify(cur.blocs[i])+'\nDemande : '+m));cur.blocs[i]=r;show();st('')}catch(x){st('');toast(x.message)}bz(false)}
async function run(sur,re){const u=$('#u').value;let ti=$('#ti').value.trim();bz(true);
 try{if(sur||!ti){st('Je cherche un titre…');ti=(await ask(cfg.mw,'Invente un titre de vidéo TikTok drôle et original, en une phrase. Réponds seulement par le titre. Évite ces titres : '+hist.map(h=>h.titre).join(' ; ')+(prof?'\nProfil éditorial : '+prof:''),'Univers : '+u)).trim().replace(/^["«\s]+|["»\s]+$/g,'');$('#ti').value=ti}
  st('J’écris l’histoire…');let s=J(await ask(cfg.mw,sysW(u),'Titre : '+ti));
  st('Je vérifie la cohérence…');try{const r=J(await ask(cfg.mc,sysC(),JSON.stringify(s)));s=r.histoire||s;s._p=r.problemes||[]}catch(x){s._p=['Vérification impossible : '+x.message]}
  cur=s;hist.unshift({titre:s.titre||ti,s,d:Date.now()});hist=hist.slice(0,12);W('bl_tt_hist',hist);show();hs();st('')}
 catch(x){st('');toast(x.message)}bz(false)}
$('#go').onclick=()=>run(0,0);$('#su').onclick=()=>run(1,0);

function ref(){$('#pf').textContent=prof||'Le profil se construit avec les vidéos que tu analyses.';
 $('#lb').innerHTML=lib.map((r,i)=>`<div class="c"><h3>${e(r.lien||'Référence '+(lib.length-i))}</h3><pre>${e(r.stats?'Stats : '+r.stats+'\n':'')+Object.entries(r.a).map(([k,v])=>k+' : '+v).join('\n')}</pre><button class="g" onclick="rm(${i})">Supprimer</button></div>`).join('')}
function rm(i){lib.splice(i,1);W('bl_tt_lib',lib);ref()}
function hs(){$('#hs').innerHTML=hist.map((h,i)=>`<div class="c"><h3>${e(h.titre)}</h3><div class="r" style="margin-top:8px"><button class="g" onclick="op(${i})">Rouvrir</button></div></div>`).join('')||'<p class="n">Aucune production pour l’instant.</p>'}
function op(i){cur=hist[i].s;$('#ti').value=hist[i].titre;show();document.querySelector('nav button').click()}
$('#an').onclick=async()=>{bz(true);
 try{let url='';const f=$('#fv').files[0];
  if(f){toast('Envoi de la vidéo…');const n='ref-'+Date.now()+'.mp4',fd=new FormData();fd.append('file',f,n);fd.append('uploadPath','bl-studios');fd.append('fileName',n);
   const j=await(await fetch('https://kieai.redpandaai.co/api/file-stream-upload',{method:'POST',headers:{Authorization:'Bearer '+K},body:fd})).json();url=j.data&&(j.data.downloadUrl||j.data.fileUrl)||'';if(!url)throw Error(j.msg||'Envoi de la vidéo impossible.')}
  const n=$('#nt').value.trim();if(!url&&!n)throw Error('Importe la vidéo ou colle sa description.');
  toast('Analyse en cours…');
  const a=J(await ask(cfg.mc,'Analyse cette vidéo TikTok. Réponds uniquement en JSON : {"accroche":"","scenario":"","humour":"","personnages":"","dialogues":"","rythme":"","rebondissements":"","chute":"","pourquoi":"ce qui peut expliquer l’intérêt du public"}',`Lien : ${$('#lk').value}\nStats : ${$('#sx').value}\nNotes : ${n}`,url));
  lib.unshift({lien:$('#lk').value,stats:$('#sx').value,a,d:Date.now()});W('bl_tt_lib',lib);
  prof=(await ask(cfg.mw,'Fusionne en un profil éditorial de 150 mots maximum les mécanismes qui reviennent (accroches, humour, structures, rythme). Ne recopie aucune vidéo. Réponds seulement par le profil.','Profil actuel : '+prof+'\nNouvelle analyse : '+JSON.stringify(a))).trim();W('bl_tt_prof',prof);ref();toast('Référence ajoutée.')}
 catch(x){toast(x.message)}bz(false)};
$('#ru').value=cfg.rules;$('#mw').value=cfg.mw;$('#mc').value=cfg.mc;$('#du').value=cfg.d;$('#ky').value=K;
$('#sv').onclick=()=>{cfg={rules:$('#ru').value,mw:$('#mw').value.trim(),mc:$('#mc').value.trim(),d:+$('#du').value};W('bl_tt_cfg',cfg);K=$('#ky').value.trim();W('bl_tt_key',K);toast('Enregistré.')};
ref();hs();
</script></body></html>
